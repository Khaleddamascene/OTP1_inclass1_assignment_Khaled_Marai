services:
  mariadb:
    image: mariadb:11.7
    container_name: temperature-mariadb
    environment:
      MARIADB_DATABASE: temperature_converter
      MARIADB_USER: temperature_user
      MARIADB_PASSWORD: temperature_password
      MARIADB_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - temperature_db:/var/lib/mysql

  app:
    build: .
    container_name: temperature-converter
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/temperature_converter
      DB_USER: temperature_user
      DB_PASSWORD: temperature_password
      DISPLAY: host.docker.internal:0.0
    depends_on:
      - mariadb

volumes:
  temperature_db:
